# ---------- STAGE 3 : Initial Compromise (Apache RCE) ----------

[Zeus - S3a - Path Traversal CVE-2021-41773]
search = index=web sourcetype=access_combined | rex field=uri_path "(?<trav>\.%2[eE]|%2[eE]%2[eE]|\.\.%2[fF]|%252[eE])" | search trav=* | stats count as hits values(status) as statuses by clientip, uri_path
description = Encoded path-traversal against Apache (.%2e / %2e%2e / ..%2f / %252e). CRITICAL if status 200.
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */1 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.suppress = 1
alert.suppress.period = 600s
alert.suppress.fields = clientip

[Zeus - S3b - Reverse Shell Egress 4444]
