dispatch.latest_time = now
enableSched = 1
cron_schedule = */1 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.suppress = 1
alert.suppress.period = 1800s
alert.suppress.fields = src

