# =====================================================================
# Project Sisyphus - Book of Zeus : stage-detection alerts
# Maps the Dionysus (Lachlan Titmuss) red attack path to Splunk alerts.
#
# Data assumptions:
#   index=network sourcetype=pfsense       (pfSense filterlog via syslog 514)
#   index=web     sourcetype=access_combined (Apache access log via UF)
#   index=os      sourcetype=linux_audit    (auditd via UF)
#   index=os      sourcetype=linux_secure   (auth.log via UF)
# Network rules self-parse filterlog with split/mvindex, so they work
# with OR without the pfSense TA. Command detection reads type=EXECVE a0=...
# and file detection reads type=PATH name=... (props.conf keeps 1 record/line).
#
# Triggered alerts appear in: Activity -> Triggered Alerts.
# Severity: 2=Info/recon, 4=Medium, 6=Critical.
# =====================================================================

# ---------- STAGE 1 : Reconnaissance ----------

[Zeus - S1a - ICMP Ping Sweep]
search = index=network sourcetype=pfsense filterlog | rex field=_raw "filterlog[^:]*:\s*(?<csv>.+)$" | eval f=split(csv,","), proto=mvindex(f,16), src_ip=mvindex(f,18), dest_ip=mvindex(f,19) | where proto="icmp" | bucket span=2m _time | stats dc(dest_ip) as hosts_pinged by _time, src_ip | where hosts_pinged > 5
description = nmap -sn style ICMP sweep: one source pinging >5 hosts in 2 min.
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */2 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 2
alert.suppress = 1
alert.suppress.period = 3600s
alert.suppress.fields = src_ip

[Zeus - S1b - TCP Port Scan]
search = index=network sourcetype=pfsense filterlog | rex field=_raw "filterlog[^:]*:\s*(?<csv>.+)$" | eval f=split(csv,","), proto=mvindex(f,16), src_ip=mvindex(f,18), dest_ip=mvindex(f,19), dest_port=mvindex(f,21) | where proto="tcp" | bucket span=1m _time | stats dc(dest_port) as ports_touched by _time, src_ip, dest_ip | where ports_touched > 20
description = nmap service/port scan: one source hitting >20 ports on a host in 1 min.
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */2 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 2
alert.suppress = 1
alert.suppress.period = 3600s
alert.suppress.fields = src_ip

# ---------- STAGE 2 : Web Application Enumeration ----------

[Zeus - S2a - Directory Brute Force]
search = index=web sourcetype=access_combined status=404 | bucket span=2m _time | stats count as err404 dc(uri_path) as uniq_paths by _time, clientip | where err404 >= 40 AND uniq_paths >= 25
description = gobuster/dirsearch: >=40 404s across >=25 unique paths from one client in 2 min.
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */2 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 3600s
alert.suppress.fields = clientip

[Zeus - S2b - CGI Probe]
