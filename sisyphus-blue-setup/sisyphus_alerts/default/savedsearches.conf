description = Outbound reverse shell from DMZ host to Red Team on port 4444. CRITICAL - DMZ compromise.
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */1 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.suppress = 1
alert.suppress.period = 600s
alert.suppress.fields = src_ip

# ---------- STAGE 4 / 7 : Host Enumeration (by host) ----------

[Zeus - S4 - Host Enumeration]
search = index=os sourcetype=linux_audit type=EXECVE (a0="whoami" OR a0="id" OR a0="uname" OR a0="ip" OR a0="ss" OR a0="netstat" OR a0="ps" OR a0="find" OR a0="ifconfig" OR a0="route" OR a0="hostname") | bucket span=5m _time | stats dc(a0) as uniq_cmds values(a0) as cmds by _time, host | where uniq_cmds >= 4
description = Post-exploit enumeration burst (>=4 distinct recon commands in 5 min). host field = which box (Stage 4 DMZ / Stage 7 internal).
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */2 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1800s
alert.suppress.fields = host

